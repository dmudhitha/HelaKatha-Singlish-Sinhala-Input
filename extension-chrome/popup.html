<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelaKatha Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <span class="icon">සි</span>
      <div class="titles">
        <h2>HelaKatha</h2>
        <p>Singlish to Sinhala Input</p>
      </div>
    </div>
    <span class="badge">v1.0.1</span>
  </div>

  <div class="toggle-card">
    <div class="toggle-label">
      <strong>Singlish Typing</strong>
      <span id="status-text">Enabled (Active)</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle-enabled" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="section">
    <div class="setting-item">
      <div class="setting-info">
        <span>Output Format</span>
        <small id="mode-desc">Standard Sinhala Unicode (Web/Doc)</small>
      </div>
      <select id="mode-select">
        <option value="unicode">Sinhala Unicode</option>
        <option value="fm_abhaya">FM Abhaya (Legacy)</option>
      </select>
    </div>

    <div class="setting-item">
      <div class="setting-info">
        <span>Theme</span>
        <small>Popup & Candidate Box Appearance</small>
      </div>
      <select id="theme-select">
        <option value="dark">Dark Theme</option>
        <option value="light">Light Theme</option>
      </select>
    </div>
  </div>

  <div class="shortcuts-card">
    <div class="shortcut-row">
      <span>Toggle On/Off</span>
      <kbd>Alt + Space</kbd>
    </div>
    <div class="shortcut-row">
      <span>Commit Word</span>
      <kbd>Space / Enter</kbd>
    </div>
    <div class="shortcut-row">
      <span>Select Candidate</span>
      <kbd>1 - 5</kbd>
    </div>
  </div>

  <div class="footer">
    <span>🇱🇰 Made for the Sri Lankan Community</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
